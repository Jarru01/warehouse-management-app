services:
  db:
    image: postgres:17-alpine
    container_name: warehouse-db
    environment:
      POSTGRES_DB: sklad
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
    ports:
      - "5432:5432"
    volumes:
      - warehouse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d sklad"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  warehouse-pgdata:
