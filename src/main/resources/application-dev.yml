# Local development only. These values match compose.yaml and must never be
# used anywhere else.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sklad
    username: warehouse
    password: warehouse
  thymeleaf:
    cache: false
  web:
    resources:
      chain:
        # Recompute CSS/JS hashes on every request so edits show up without a restart.
        cache: false
  mail:
    # Mailpit from compose.yaml catches every e-mail; read them at http://localhost:8025
    host: localhost
    port: 1025

warehouse:
  # Base address used in links inside e-mails. Never taken from the request,
  # so a forged Host header cannot redirect recovery links.
  verejna-adresa: http://localhost:8080
  riaditel:
    # Initial password of the seeded director, applied only while the director has none.
    # The director must change it after the first login.
    heslo: riaditel-dev-heslo
