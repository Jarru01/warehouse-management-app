# HTTPS directly in the application, for local use without a reverse proxy.
# Combine with dev: SPRING_PROFILES_ACTIVE=dev,https. The keystore is a
# self-signed certificate created with the keytool command from the README.
server:
  port: 8443
  ssl:
    enabled: true
    key-store: ${WAREHOUSE_SSL_KEYSTORE:file:certs/localhost.p12}
    key-store-type: PKCS12
    key-store-password: ${WAREHOUSE_SSL_HESLO:changeit}
    key-alias: warehouse
  servlet:
    session:
      cookie:
        secure: true

warehouse:
  verejna-adresa: https://localhost:8443
