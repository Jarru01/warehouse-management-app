# Settings shared by every environment. Secrets live only in the profile files
# (dev) or in environment variables (prod). Without an active profile the app
# starts with the "dev" profile.
spring:
  application:
    name: warehouse-management-app
  profiles:
    default: dev
  datasource:
    hikari:
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Databases created by Hibernate before Flyway was added already contain
    # the V1 schema; Flyway marks them as version 1 and applies the rest.
    baseline-on-migrate: true
    baseline-version: 1
  session:
    # Sessions live in PostgreSQL, so they survive restarts and are shared by
    # every instance. The tables are created by Flyway (V4).
    jdbc:
      initialize-schema: never
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

# Only the health and info endpoints are exposed. /actuator/health/liveness and
# /actuator/health/readiness are ready for container health checks.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # An unavailable mail server must not mark the whole application as down.
    mail:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: warehouse-management-app

warehouse:
  prihlasenie:
    # Failed logins allowed per account (role + ID) and per IP address within
    # the window; after that further attempts are refused until the window ends.
    max-pokusov-na-ucet: 5
    max-pokusov-z-adresy: 20
    okno: 15m
  obnova-hesla:
    # How long a password recovery link stays valid.
    platnost: 30m
    odosielatel: "Warehouse App <noreply@warehouse.local>"
  audit:
    # Audit records older than this are deleted by the nightly maintenance.
    uchovavat: 365d
  udrzba:
    cron: "0 30 3 * * *"
