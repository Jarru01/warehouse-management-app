spring:
  application:
    name: warehouse-management-app
  datasource:
    url: jdbc:postgresql://localhost:5432/sklad
    username: warehouse
    password: warehouse
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false

server:
  port: 8080

warehouse:
  riaditel:
    # Initial password of the seeded director, set only while the director has no password.
    # Local development value; override with WAREHOUSE_RIADITEL_HESLO everywhere else.
    heslo: riaditel-dev-heslo
