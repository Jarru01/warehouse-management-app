<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="hlavicka(titul)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1220">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d4ed8'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='12' font-weight='bold' fill='white' text-anchor='middle'%3EWA%3C/text%3E%3C/svg%3E">
    <title th:text="${titul} + ' · Warehouse App'">Warehouse App</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:fragment="topbar(sekcia)" class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark" aria-hidden="true">WA</span>
        <span>Warehouse App</span>
    </a>
    <div class="topbar-meta">
        <span class="badge" th:if="${sekcia}" th:text="${sekcia}">Rola</span>
        <span class="topbar-user" th:if="${session.meno}"
              th:text="${session.meno} + ' ' + (${session.priezvisko} ?: '')">Meno</span>
        <form class="inline" method="post" th:action="@{/odhlasenie}" th:if="${session.meno}">
            <button type="submit" class="btn btn-ghost btn-sm">Prepnúť používateľa</button>
        </form>
    </div>
</header>

<div th:fragment="spravy">
    <p class="alert alert-success" role="status" aria-live="polite" th:if="${sprava}">
        <span th:text="${sprava}">Hotovo.</span>
        <button type="button" class="alert-close" data-zavriet aria-label="Zavrieť upozornenie">×</button>
    </p>
    <p class="alert alert-error" role="alert" th:if="${chyba}">
        <span th:text="${chyba}">Chyba.</span>
        <button type="button" class="alert-close" data-zavriet aria-label="Zavrieť chybu">×</button>
    </p>
</div>

<footer th:fragment="pata" class="footer">
    <span>Warehouse App</span>
</footer>

<dialog th:fragment="potvrdenie" id="potvrdenie" class="dialog" aria-labelledby="potvrdenie-nadpis">
    <form method="dialog">
        <h2 id="potvrdenie-nadpis">Potvrdenie</h2>
        <p id="potvrdenie-text">Naozaj chcete pokračovať?</p>
        <div class="dialog-actions">
            <button value="zrusit" class="btn btn-ghost">Zrušiť</button>
            <button value="potvrdit" class="btn btn-danger">Potvrdiť</button>
        </div>
    </form>
</dialog>

<script th:fragment="appskript" th:src="@{/app.js}" defer></script>

</body>
</html>
