<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: hlavicka('Pracovník')}"></head>
<body>
<a class="skip-link" href="#obsah">Preskočiť na obsah</a>
<header th:replace="~{fragments/layout :: topbar('Pracovník')}"></header>
<main id="obsah" class="container">
    <h1 class="visually-hidden">Panel pracovníka</h1>
    <div th:replace="~{fragments/layout :: spravy}"></div>

    <section class="card">
        <div class="card-head">
            <h2>Moja poloha</h2>
            <span class="badge" th:text="${pracovnik.miestnost}">-</span>
        </div>
        <form method="post" th:action="@{/pracovnik/presun}">
            <div class="field">
                <label for="miestnost">Presunúť do miestnosti</label>
                <select id="miestnost" name="miestnost">
                    <option th:each="miestnost : ${miestnosti}" th:value="${miestnost.kluc}"
                            th:text="${miestnost.kluc}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Presunúť</button>
        </form>
    </section>

    <section class="card">
        <div class="card-head"><h2>Držaný tovar</h2></div>
        <div th:if="${drzanyTovar != null}">
            <p>
                <span class="badge num" th:text="'ID ' + ${drzanyTovar.id}"></span>
                <span th:text="${drzanyTovar.nazov}"></span>
            </p>
            <form method="post" th:action="@{/pracovnik/uloz}">
                <button type="submit" class="btn btn-primary">Uložiť do regálu</button>
            </form>
        </div>
        <p class="empty-state" th:if="${drzanyTovar == null}">Nič nedržíš.</p>
    </section>

    <section class="card">
        <div class="card-head"><h2>Regále v miestnosti</h2></div>
        <p class="empty-state" th:if="${regale.isEmpty()}">V miestnosti nie sú regále.</p>
        <div class="rack" th:each="regal : ${regale}">
            <h3 th:text="'Regál #' + ${regal.id} + ' · kapacita ' + ${regal.kapacita}"></h3>
            <ul>
                <li th:each="tovar : ${regal.tovar}">
                    <span>
                        <span class="badge num" th:text="'#' + ${tovar.slot}"></span>
                        <span th:text="${tovar.id} + ' · ' + ${tovar.nazov}"></span>
                    </span>
                    <form method="post" th:action="@{/pracovnik/zober}">
                        <input type="hidden" name="tovarId" th:value="${tovar.id}">
                        <button type="submit" class="btn btn-ghost btn-sm">Zobrať</button>
                    </form>
                </li>
                <li th:if="${regal.tovar.isEmpty()}"><span class="empty-state">Prázdny regál</span></li>
            </ul>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: pata}"></footer>
<script th:replace="~{fragments/layout :: appskript}"></script>
</body>
</html>
